name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Type-check, test and build the PWA via the shared studio workflow.
  web:
    uses: ./.github/workflows/reusable-ci-web.yml
    with:
      node-version: '22'
      package-manager: npm
      typecheck-command: npm run check
      test-command: npm test
      build-command: npm run build

  # Conventional-Commits PR titles. Cartridge has no ESLint/Prettier yet — the
  # @jrm/eslint-config and @jrm/prettier-config presets are not published, and
  # score-king carries none either. The shared reusable-ci-lint workflow runs its
  # lint and format steps unconditionally, so calling it with empty commands fails
  # the run at startup; adopt it wholesale once the presets exist and this repo has
  # real commands to give it. Until then, validate the PR title here.
  pr-title:
    name: Semantic PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
            perf
          requireScope: false

  # The bridge is a separate package with its own toolchain.
  bridge:
    name: Bridge typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - working-directory: bridge
        run: npm install --no-audit --no-fund
      - working-directory: bridge
        run: npm run typecheck
