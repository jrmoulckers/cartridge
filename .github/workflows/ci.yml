name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  web:
    permissions:
      contents: read
      packages: read
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-web.yml@5f6ff9e22d82be576e01d0b094315a202ccbd186 # main
    with:
      node-version: '22'
      package-manager: npm
      typecheck-command: npm run check
      test-command: npm test
      build-command: npm run build
      artifact-name: web-build
      artifact-path: dist
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'

  preview:
    if: github.event_name == 'pull_request'
    needs: web
    permissions:
      contents: read
      packages: read
    uses: jrmoulckers/.github/.github/workflows/reusable-deploy-preview.yml@5f6ff9e22d82be576e01d0b094315a202ccbd186 # main
    with:
      artifact-name: ${{ needs.web.outputs.artifact-name }}
      output-dir: dist
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'

  perf:
    needs: web
    permissions:
      contents: read
      packages: read
    uses: jrmoulckers/.github/.github/workflows/reusable-perf-budget.yml@5f6ff9e22d82be576e01d0b094315a202ccbd186 # main
    with:
      artifact-name: ${{ needs.web.outputs.artifact-name }}
      output-dir: dist
      bundle-budget-kb: 2048
      lighthouse-public-upload: false
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'

  lint:
    permissions:
      contents: read
      packages: read
      pull-requests: read
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-lint.yml@5f6ff9e22d82be576e01d0b094315a202ccbd186 # main
    with:
      node-version: '22'
      package-manager: npm
      # vendor:check verifies config/engineering/** against engineering-configs.lock.json.
      # A hand-edit to a generated file otherwise makes "vendored at ref X" a false claim.
      # Its drift-vs-staleness semantics are upstream's to define, not ours to restate here —
      # see docs/adopting.md in jrmoulckers/engineering.
      # The offline variant is deliberate. Drift is what CI can act on and stays fatal;
      # staleness is a decision for a human at a keyboard, and the lookup behind it is an
      # unauthenticated call to a third party from a shared runner IP, where the 60/hour
      # limit is most likely to be hit. The run states that it skipped the check, so a
      # quiet gate is not mistaken for evidence that the pin is current.
      # `check:boundaries` proves the layering claims ARCHITECTURE.md makes — an invariant
      # nothing checks is only a comment. It runs before `lint` so a broken boundary is
      # reported as a boundary failure rather than buried in rule output.
      lint-command: npm run vendor:check:offline && npm run check:boundaries && npm run lint
      format-check-command: npm run format:check
      semantic-pr-title: true
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'

  # reusable-security-ci deliberately gets no registry inputs and no packages: read.
  # It has no install step, and `npm audit` resolves advisory data from the default
  # registry rather than the scoped one, so it is unaffected by @jrmoulckers/* being
  # private. Verified against a consumer run whose audit job passed while its install
  # jobs were failing on the same lockfile. The workflow does not accept these inputs.
  security:
    permissions:
      contents: read
    uses: jrmoulckers/.github/.github/workflows/reusable-security-ci.yml@5f6ff9e22d82be576e01d0b094315a202ccbd186 # main
    with:
      node-version: '22'
      package-manager: npm
      run-dependency-review: true

  bridge-security:
    permissions:
      contents: read
    uses: jrmoulckers/.github/.github/workflows/reusable-security-ci.yml@5f6ff9e22d82be576e01d0b094315a202ccbd186 # main
    with:
      node-version: '22'
      package-manager: npm
      working-directory: bridge
      run-secret-scan: false
      # Dependency review stays off here, and not because it is unavailable — it runs in the
      # `security` job above. The check is repository-scoped: it reads the pull request's
      # dependency-graph diff through the API and takes no working directory, so the `bridge`
      # value above does not narrow it. Enabling it here would run the identical check a second
      # time under a second name, covering bridge/package-lock.json exactly as often as once.
      run-dependency-review: false

  bridge:
    name: Bridge typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Install bridge dependencies
        working-directory: bridge
        run: npm ci --no-audit --no-fund
      - name: Typecheck bridge
        working-directory: bridge
        run: npm run typecheck
