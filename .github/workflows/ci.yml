name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege at the top level. NOTE: a top-level `permissions:` block zeroes
# every scope it does not name, including for called workflows, so any job that
# needs more must re-declare it (see `pr-title` below).
permissions:
  contents: read

jobs:
  # Type-check, test and build the PWA via the backbone's shared workflow.
  # Reusable workflows are "native" to the studio sync engine: it reports them but
  # never writes them, so this file is product-owned and must reference the
  # backbone by ref rather than carrying a local copy.
  web:
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-web.yml@main
    with:
      node-version: '22'
      package-manager: npm
      typecheck-command: npm run check
      test-command: npm test
      build-command: npm run build

  # Uploads the built PWA as a downloadable artifact for review on each PR.
  # `output-dir: dist` is Vite's build output; no DEPLOY_TOKEN is passed because
  # the default `artifact` provider does not use one.
  preview:
    if: github.event_name == 'pull_request'
    uses: jrmoulckers/.github/.github/workflows/reusable-deploy-preview.yml@main
    with:
      node-version: '22'
      package-manager: npm
      build-command: npm run build
      output-dir: dist
      provider: artifact

  # Bundle-size budget over the same `dist`. `url` is deliberately omitted: with no
  # deployed preview URL the Lighthouse step self-skips and only the size budget runs.
  perf:
    uses: jrmoulckers/.github/.github/workflows/reusable-perf-budget.yml@main
    with:
      node-version: '22'
      package-manager: npm
      build-command: npm run build
      output-dir: dist
      bundle-budget-kb: 2048

  # Conventional-Commits PR titles. This is the one part of reusable-ci-lint we can
  # use today: that workflow runs its lint and format steps unconditionally, and
  # cartridge has no ESLint/Prettier (the @jrm/eslint-config and @jrm/prettier-config
  # presets have no transport to member repos). Calling it with empty commands fails
  # the run at startup, so the title check is inlined here. Swap this job for
  # reusable-ci-lint.yml@main once this repo has real lint/format commands.
  pr-title:
    name: Semantic PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
            perf
          requireScope: false

  # The bridge is a separate package with its own toolchain.
  bridge:
    name: Bridge typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - working-directory: bridge
        run: npm install --no-audit --no-fund
      - working-directory: bridge
        run: npm run typecheck
