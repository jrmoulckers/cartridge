name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege at the top level. NOTE: a top-level `permissions:` block zeroes
# every scope it does not name, including for called workflows, so any job that
# needs more must re-declare it (see `lint` below).
permissions:
  contents: read

jobs:
  # Type-check, test and build the PWA via the backbone's shared workflow.
  # Reusable workflows are "native" to the studio sync engine: it reports them but
  # never writes them, so this file is product-owned and must reference the
  # backbone by ref rather than carrying a local copy.
  web:
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-web.yml@main
    with:
      node-version: '22'
      package-manager: npm
      typecheck-command: npm run check
      test-command: npm test
      build-command: npm run build

  # Uploads the built PWA as a downloadable artifact for review on each PR.
  # `output-dir: dist` is Vite's build output; no DEPLOY_TOKEN is passed because
  # the default `artifact` provider does not use one.
  preview:
    if: github.event_name == 'pull_request'
    uses: jrmoulckers/.github/.github/workflows/reusable-deploy-preview.yml@main
    with:
      node-version: '22'
      package-manager: npm
      build-command: npm run build
      output-dir: dist
      provider: artifact

  # Bundle-size budget over the same `dist`. `url` is deliberately omitted: with no
  # deployed preview URL the Lighthouse step self-skips and only the size budget runs.
  perf:
    uses: jrmoulckers/.github/.github/workflows/reusable-perf-budget.yml@main
    with:
      node-version: '22'
      package-manager: npm
      build-command: npm run build
      output-dir: dist
      bundle-budget-kb: 2048

  # Conventional-Commits PR titles, via the backbone. Cartridge has no ESLint or
  # Prettier — the @jrm/eslint-config and @jrm/prettier-config presets have no
  # transport to member repos — so both commands are passed as empty strings and
  # the workflow's `lint` job self-skips, leaving only the title check. Give this
  # job real commands once the repo has lint/format scripts; nothing else changes.
  lint:
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-lint.yml@main
    # Required: the top-level `permissions:` above zeroes every scope it does not
    # name, and the title check needs `pull-requests: read`. Omitting this is a
    # startup_failure with no readable log.
    permissions:
      contents: read
      pull-requests: read
    with:
      node-version: '22'
      package-manager: npm
      lint-command: ''
      format-check-command: ''
      semantic-pr-title: true

  # The bridge is a separate package with its own toolchain.
  bridge:
    name: Bridge typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - working-directory: bridge
        run: npm install --no-audit --no-fund
      - working-directory: bridge
        run: npm run typecheck
