name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  web:
    permissions:
      contents: read
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-web.yml@09af9883ed3644aff83ce2acc2d67a4f631f3396 # main
    with:
      node-version: '22'
      package-manager: npm
      typecheck-command: npm run check
      test-command: npm test
      build-command: npm run build
      artifact-name: web-build
      artifact-path: dist

  preview:
    if: github.event_name == 'pull_request'
    needs: web
    permissions:
      contents: read
    uses: jrmoulckers/.github/.github/workflows/reusable-deploy-preview.yml@09af9883ed3644aff83ce2acc2d67a4f631f3396 # main
    with:
      artifact-name: ${{ needs.web.outputs.artifact-name }}
      output-dir: dist

  perf:
    needs: web
    permissions:
      contents: read
    uses: jrmoulckers/.github/.github/workflows/reusable-perf-budget.yml@09af9883ed3644aff83ce2acc2d67a4f631f3396 # main
    with:
      artifact-name: ${{ needs.web.outputs.artifact-name }}
      output-dir: dist
      bundle-budget-kb: 2048
      lighthouse-public-upload: false

  # Cartridge has no transported lint or format presets, so only the title check runs.
  lint:
    permissions:
      contents: read
      pull-requests: read
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-lint.yml@09af9883ed3644aff83ce2acc2d67a4f631f3396 # main
    with:
      node-version: '22'
      package-manager: npm
      lint-command: ''
      format-check-command: ''
      semantic-pr-title: true

  security:
    permissions:
      contents: read
    uses: jrmoulckers/.github/.github/workflows/reusable-security-ci.yml@09af9883ed3644aff83ce2acc2d67a4f631f3396 # main
    with:
      node-version: '22'
      package-manager: npm
      # The repository does not expose Dependency Graph/GHAS dependency review.
      run-dependency-review: false

  bridge-security:
    permissions:
      contents: read
    uses: jrmoulckers/.github/.github/workflows/reusable-security-ci.yml@09af9883ed3644aff83ce2acc2d67a4f631f3396 # main
    with:
      node-version: '22'
      package-manager: npm
      working-directory: bridge
      run-secret-scan: false
      run-dependency-review: false

  bridge:
    name: Bridge typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Install bridge dependencies
        working-directory: bridge
        run: npm ci --no-audit --no-fund
      - name: Typecheck bridge
        working-directory: bridge
        run: npm run typecheck
