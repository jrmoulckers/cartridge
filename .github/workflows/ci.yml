name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  web:
    permissions:
      contents: read
      packages: read
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-web.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace # main
    with:
      node-version: '22'
      package-manager: npm
      typecheck-command: npm run check
      test-command: npm test
      build-command: npm run build
      artifact-name: web-build
      artifact-path: dist
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  preview:
    if: github.event_name == 'pull_request'
    needs: web
    permissions:
      contents: read
      packages: read
    uses: jrmoulckers/.github/.github/workflows/reusable-deploy-preview.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace # main
    with:
      artifact-name: ${{ needs.web.outputs.artifact-name }}
      output-dir: dist
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  perf:
    needs: web
    permissions:
      contents: read
      packages: read
    uses: jrmoulckers/.github/.github/workflows/reusable-perf-budget.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace # main
    with:
      artifact-name: ${{ needs.web.outputs.artifact-name }}
      output-dir: dist
      bundle-budget-kb: 2048
      lighthouse-public-upload: false
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    permissions:
      contents: read
      packages: read
      pull-requests: read
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-lint.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace # main
    with:
      node-version: '22'
      package-manager: npm
      lint-command: npm run lint
      format-check-command: npm run format:check
      semantic-pr-title: true
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # UPSTREAM: reusable-security-ci does not yet accept registry-url/registry-scope
  # (it was not part of jrmoulckers/.github#107, which only covered the six
  # install-bearing workflows). Its `npm audit` resolves advisory metadata for
  # @jrmoulckers/* from GitHub Packages and will 401 until the same inputs are
  # added there. Re-pin and pass the inputs once that lands.
  security:
    permissions:
      contents: read
    uses: jrmoulckers/.github/.github/workflows/reusable-security-ci.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace # main
    with:
      node-version: '22'
      package-manager: npm
      # The repository does not expose Dependency Graph/GHAS dependency review.
      run-dependency-review: false

  bridge-security:
    permissions:
      contents: read
    uses: jrmoulckers/.github/.github/workflows/reusable-security-ci.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace # main
    with:
      node-version: '22'
      package-manager: npm
      working-directory: bridge
      run-secret-scan: false
      run-dependency-review: false

  bridge:
    name: Bridge typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Install bridge dependencies
        working-directory: bridge
        run: npm ci --no-audit --no-fund
      - name: Typecheck bridge
        working-directory: bridge
        run: npm run typecheck
